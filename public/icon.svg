<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#040d1a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="url(#cyan-glow)" stroke-width="6" stroke-opacity="0.3" fill="none" />

  <!-- Neon Drop / P2P node shape -->
  <g filter="url(#glow)">
    <!-- Water drop with cut/p2p loop -->
    <path d="M256 96 C256 96 144 240 144 336 C144 397.85 194.15 448 256 448 C317.85 448 368 397.85 368 336 C368 240 256 96 256 96 Z" 
          fill="none" 
          stroke="url(#cyan-glow)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center interconnected P2P arrows -->
    <path d="M200 310 L256 254 L312 310" 
          stroke="url(#cyan-glow)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <path d="M256 260 L256 380" 
          stroke="url(#cyan-glow)" 
          stroke-width="28" 
          stroke-linecap="round" />

    <!-- Pulsing peer dot -->
    <circle cx="256" cy="190" r="16" fill="#00f2fe" />
  </g>
</svg>
